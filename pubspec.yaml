name: employee_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+5

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  get: ^4.7.3
  http: ^1.6.0
  shared_preferences: ^2.5.4
  camera: ^0.12.0+1
  geolocator: ^14.0.2
  permission_handler: ^12.0.1
  intl: ^0.20.2
  mobile_scanner: ^7.2.0
  printing: ^5.14.3
  image_picker: ^1.2.1
  audioplayers: ^6.6.0
  device_info_plus: ^12.4.0
 
  
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  flutter_launcher_icons: ^0.14.4
  flutter_native_splash:

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/sounds/hrmsattendanceringtone.aac

flutter_icons:
  android: true
  ios: true
  image_path: "assets/app_logo.jpeg"

